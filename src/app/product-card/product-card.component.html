<div class="card h-100 shadow-sm border-0 rounded-3">
  <!-- Image Header Container -->
  <div class="bg-light p-3 text-center rounded-top position-relative d-flex align-items-center justify-content-center" style="height: 220px;">
    <img [src]="prodObj?.image" [alt]="prodObj?.title" class="img-fluid" style="max-height: 180px; object-fit: contain;">
  </div>

  <!-- Card Body -->
  <div class="card-body d-flex flex-column p-3">
    <!-- Category Badge -->
    <div>
      <span class="badge bg-primary text-capitalize mb-2 px-2 py-1 fs-6 fw-normal">
        {{ prodObj?.category }}
      </span>
    </div>

    <!-- Title -->
    <h6 class="card-title fw-bold text-dark text-truncate mb-1" [title]="prodObj?.title">
      {{ prodObj?.title }}
    </h6>

    <!-- Rating -->
    <div class="small mb-2">
      <span class="text-warning fw-bold">⭐ {{ prodObj?.rating?.rate }}</span>
      <span class="text-muted ms-1">({{ prodObj?.rating?.count }} reviews)</span>
    </div>

    <!-- Description -->
    <p class="card-text text-muted small flex-grow-1 mb-3" style="font-size: 0.85rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
      {{ prodObj?.description }}
    </p>

    <!-- Price -->
    <div class="mb-3">
      <span class="fw-bold text-success fs-5">${{ prodObj?.price }}</span>
    </div>

    <!-- Footer: Add to Cart and Buy Now Buttons -->
    <div class="d-flex justify-content-between mt-auto">
  <button class="btn btn-outline-warning btn-sm flex-fill me-2 mr-2 fw-bold d-flex align-items-center justify-content-center">
     Add to Cart
  </button>
  <button class="btn btn-success btn-sm flex-fill fw-bold d-flex align-items-center justify-content-center" style="background-color: #d81b60; border: none;">
     Buy Now
  </button>
</div>
  </div>
</div>
